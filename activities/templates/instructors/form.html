{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Edit{% else %}New{% endif %} instructor{% endblock %}

{% block content %}
  <h1>{% if form.instance.pk %}Edit{% else %}New{% endif %} instructor</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a class="btn" href="{% url 'instructor-list' %}">Back to list</a>
  </form>
{% endblock %}
