{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>

  {% if form.errors %}
    <p class="error">Wrong username or password. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
    <a class="btn" href="{% url 'home' %}">Back</a>
  </form>

  <p class="muted">Staff accounts are created with <code>manage.py createsuperuser</code>.</p>
{% endblock %}
